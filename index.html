		<button class="menu-icon" popovertarget="menu">

		</button>

		<div id="menu" popover="manual">
			<button class="menu-icon" popovertarget="menu" popovertargetaction="hide">

		<div class="type"></div>

		<div class="type-relations">
			<div class="strong-container">
				<div class="strong">
					<section class="double_damage">
						<div class="category">
							x2 <br />
							to
						</div>
						<div class="double_damage_to icons-container"></div>
					</section>

					<section class="no_damage">
						<div class="entity category">0 <br />from</div>
						<div class="no_damage_from icons-container"></div>
					</section>

					<section class="half_damage">
						<div class="entity category">
							&frac12; <br />
							from
						</div>
						<div class="half_damage_from icons-container"></div>
					</section>
				</div>

				<div class="arrow-container">
					<div class="arrow up"></div>
				</div>
				<h3 class="category">Strong against</h3>
			</div>

			<div class="weak-container">
				<div class="weak">
					<section class="half_damage">

					<section class="no_damage">

							0 <br />
							to

						<div class="no_damage_to icons-container"></div>
					</section>

					<section class="double_damage">
						<div class="category">
							x2 <br />
							from
						</div>
						<div class="double_damage_from icons-container"></div>
					</section>
				</div>

				<div class="arrow-container">
					<div class="arrow down"></div>
				</div>
				<h3 class="category">Weak against</h3>
			</div>
